<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2b5e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00599C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#004482;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon background (C++ logo shape) -->
  <polygon points="128,8 232,64 232,192 128,248 24,192 24,64"
           fill="url(#hexGrad)" filter="url(#shadow)" stroke="#0a1f44" stroke-width="2"/>

  <!-- Inner hexagon -->
  <polygon points="128,28 212,74 212,182 128,228 44,182 44,74"
           fill="url(#innerGrad)" opacity="0.9"/>

  <!-- Subtle inner bevel lines -->
  <polygon points="128,35 206,78 206,178 128,221 50,178 50,78"
           fill="none" stroke="#1a6ab8" stroke-width="1" opacity="0.3"/>

  <!-- Main "C" letter -->
  <text x="80" y="162" font-family="'Segoe UI', Arial, sans-serif" font-size="110" font-weight="bold"
        fill="white" filter="url(#glow)" opacity="0.95">C</text>

  <!-- First "+" -->
  <g transform="translate(162, 98)">
    <rect x="0" y="-20" width="8" height="44" rx="2" fill="white" opacity="0.95"/>
    <rect x="-18" y="-2" width="44" height="8" rx="2" fill="white" opacity="0.95"/>
  </g>

  <!-- Second "+" -->
  <g transform="translate(198, 98)">
    <rect x="0" y="-20" width="8" height="44" rx="2" fill="white" opacity="0.95"/>
    <rect x="-18" y="-2" width="44" height="8" rx="2" fill="white" opacity="0.95"/>
  </g>

  <!-- "23" badge -->
  <rect x="135" y="148" width="80" height="42" rx="10" ry="10"
        fill="#0d2b5e" stroke="#4a9eff" stroke-width="1.5" opacity="0.95"/>
  <text x="175" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold"
        fill="#4a9eff" text-anchor="middle" letter-spacing="2">23</text>

  <!-- Top highlight arc -->
  <path d="M 64,70 Q 128,30 192,70" fill="none" stroke="white" stroke-width="1.5" opacity="0.15"/>
</svg>